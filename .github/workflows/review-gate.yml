name: review-gate

# Ported verbatim from jozu-works/SkoConnect review-gate.yml (2026-11-04,
# staging-lane for skoconnect-landing). Required fail-closed AI review.
# Check-run name is matched by jozu-ops promote_runner (E6); keep it stable.
# Runs on arc-runners-landing (the 3090 ARC fleet, added 2026-11-04): the
# codex bridge binds only the tailnet address (100.89.200.72:8767) and is
# unreachable from GitHub-hosted runners. Any reviewer failure FAILs closed.
on:
  pull_request_target:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write # verdict must land as a check run on the PR HEAD SHA

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    name: AI review gate
    runs-on: arc-runners-landing
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }} # data only; never execute PR code
          fetch-depth: 0
          persist-credentials: false
      - name: Load reviewer from trusted base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Never execute reviewer code from the PR checkout: it is untrusted
          # input on a tailnet-connected runner with a write-capable token.
          if ! git show "$BASE_SHA:.github/scripts/review_gate.py" > "$RUNNER_TEMP/review_gate.py"; then
            python3 - <<'PYEOF'
          import json, os, urllib.request
          # Bootstrap failure must also FAIL the check on the PR HEAD SHA —
          # a comment alone cannot gate the head commit. NOTE: on the enabling
          # PR that adds this gate, the base commit has no reviewer script yet,
          # so this gate is red BY DESIGN on that one PR (house precedent:
          # gate-fix PRs are unmergeable by their own gate; founder/admin merge).
          def post(url, payload):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPO']}/{url}",
                  data=json.dumps(payload).encode(), method="POST",
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                           "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print("posted:", url, resp.status)
          try:
              post("issues/{}/comments".format(os.environ["PR"]),
                   {"body": "## 🔒 AI Review Gate — FAIL\n\nTrusted reviewer not present on base commit. Bootstrap requires human gate review; do not merge until the reviewer is installed on the base branch."})
          except Exception as e:
              print("comment failed (verdict still recorded via check run):", e)
          check_payload = {"name": "AI review gate", "head_sha": os.environ["HEAD_SHA"],
                           "status": "completed", "conclusion": "failure",
                           "output": {"title": "AI Review Gate — FAIL",
                                      "summary": "Trusted reviewer not present on base commit; do not merge."}}
          for attempt in range(3):
              try:
                  post("check-runs", check_payload)
                  break
              except Exception as e:
                  print(f"head-SHA check attempt {attempt + 1}/3 failed:", e)
          else:
              raise SystemExit("could not record head-SHA check after 3 attempts")
          PYEOF
            exit 1
          fi
      - name: Review PR diff and post gate verdict
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 "$RUNNER_TEMP/review_gate.py" "$BASE_SHA" "$HEAD_SHA"
