# SonarQube scan configuration for skoconnect-landing
# Coverage: run `npm test -- --coverage` first — jest emits coverage/lcov.info
sonar.projectKey=SkoConnect-Landing
sonar.projectName=SkoConnect-Landing

sonar.sources=app,components
sonar.inclusions=**/*.ts,**/*.tsx
sonar.exclusions=**/node_modules/**,**/out/**,**/.next/**,**/__tests__/**,**/*.test.tsx,**/coverage/**

sonar.tests=.
sonar.test.inclusions=**/__tests__/**,**/*.test.tsx

sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.host.url=http://localhost:9000
